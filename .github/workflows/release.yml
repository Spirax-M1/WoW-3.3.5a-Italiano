name: Publish release
on:
  push:
    branches: [main]
    paths: [VERSION, metadata/SHA256SUMS, scripts/build_release.py, .github/workflows/release.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-release
  cancel-in-progress: false
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_release.py
      - name: Publish versioned archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(tr -d '\r\n' < VERSION)
          gh release create "v$version" "dist/WoW-ITA-v$version.zip" "dist/WoW-ITA-v$version.zip.sha256" --target "$GITHUB_SHA" --title "WoW 3.3.5a Italiano v$version" --notes-file docs/RELEASE_NOTES.md --latest
